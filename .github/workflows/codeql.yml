name: CodeQL

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    - cron: "24 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  software-assurance-governance:
    name: Software Assurance governance
    permissions:
      contents: read
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/software-assurance-governance-aabd.yml@ef8fe39c66689822887fee3720c7500eaa76955a
    with:
      execution_profile: balanced
      owner: djconnect-music-dj/djconnect-api

  codeql:
    uses: djconnect-music-dj/djconnect-shared-workflows/.github/workflows/djconnect-codeql-191.yml@ef8fe39c66689822887fee3720c7500eaa76955a # Current canonical workflow closure
    with:
      languages: javascript-typescript
