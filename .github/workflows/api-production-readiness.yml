name: API production readiness (read only)

on:
  workflow_dispatch:
    inputs:
      current_release_sha: {required: true, type: string}

permissions:
  contents: read

jobs:
  inspect:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 26
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Check deployed version and D1 migration ledger
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_SEND_METRICS: 'false'
          CURRENT_RELEASE_SHA: ${{ inputs.current_release_sha }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN"
          [[ "$CURRENT_RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          health_sha() {
            curl --fail --silent --show-error --max-time 15 https://api.djconnect.dev/health | jq -er '.release_sha'
          }
          active_version() {
            ./node_modules/.bin/wrangler deployments status --name djconnect-api --json |
              jq -er '.versions | select(length == 1) | .[0] |
                select(.percentage == 100) | .version_id |
                select(test("^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$"))'
          }
          test "$(health_sha)" = "$CURRENT_RELEASE_SHA"
          version_id="$(active_version)"
          ./node_modules/.bin/wrangler versions view "$version_id" --name djconnect-api --json |
            jq -e --arg id "$version_id" '.id == $id' >/dev/null
          ./node_modules/.bin/wrangler d1 execute djconnect_api --remote --config wrangler.jsonc --json \
            --command 'SELECT name FROM d1_migrations ORDER BY id' > "$RUNNER_TEMP/ledger.json"
          test "$(active_version)" = "$version_id"
          test "$(health_sha)" = "$CURRENT_RELEASE_SHA"
          jq -e '
            select(type == "array" and length == 1 and .[0].success == true) |
            .[0].results | select(type == "array" and length > 0) |
            map(.name | select(type == "string" and test("^[0-9]{4}_[a-z0-9_]+\\.sql$"))) as $names |
            select(length == ($names | length)) |
            $names
          ' "$RUNNER_TEMP/ledger.json" > "$RUNNER_TEMP/applied.json"
          jq -n --arg sha "$CURRENT_RELEASE_SHA" --arg version "$version_id" \
            --slurpfile applied "$RUNNER_TEMP/applied.json" \
            '{source_sha:$sha,cloudflare_deployment_version_id:$version,applied_migrations:$applied[0]}' \
            > api-production-readiness.json
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: api-production-readiness
          path: api-production-readiness.json
          if-no-files-found: error
